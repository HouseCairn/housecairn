# Interface checks in a real browser (docs/adr/0018): an end-to-end passkey sign-in
# with Chromium's virtual authenticator, the one-click single sign-on button, the summary of
# the errors of a refused form, the tabs of the instance administration and the choice of several
# rooms or items by search and chips (docs/adr/0063); the
# installable application and offline reading (docs/adr/0065); the offer to receive the
# reminders on this device, with a simulated browser push (docs/adr/0072).
# No screenshots until the dedicated lot before the public release (docs/adr/0017).
# Not a required check. Playwright comes from the
# `docs` dependency group (locked in uv.lock, docs/adr/0016): it is not a dependency
# of the application.
name: UI

on:
  pull_request:
    paths:
      - "src/**"
      - "design/**"
      - "tests/e2e/**"
      - ".github/actions/**"
      - ".github/workflows/ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Throwaway instance, reachable from the runner only.
  SECRET_KEY: ci-only-key-for-the-ui-job-not-a-secret-0123456789abcdef
  ALLOWED_HOSTS: localhost,127.0.0.1
  SECURE_SSL_REDIRECT: "false"
  SESSION_COOKIE_SECURE: "false"
  CSRF_COOKIE_SECURE: "false"
  SECURE_HSTS_SECONDS: "0"

jobs:
  browser:
    name: Passkey and single sign-on
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies with the docs group (uv sync --locked)
        run: uv sync --locked --group docs
      - name: Compile the translations
        uses: $/.github/actions/compile-messages
      - name: Install the browser (playwright install)
        run: uv run playwright install --with-deps --only-shell --no-progress chromium
      - name: Start a stub identity provider (serves only its discovery document)
        run: |
          mkdir -p "$RUNNER_TEMP/idp/.well-known"
          cat > "$RUNNER_TEMP/idp/.well-known/openid-configuration" <<'JSON'
          {
            "issuer": "http://127.0.0.1:8002",
            "authorization_endpoint": "http://127.0.0.1:8002/authorize",
            "token_endpoint": "http://127.0.0.1:8002/token",
            "userinfo_endpoint": "http://127.0.0.1:8002/userinfo"
          }
          JSON
          nohup python3 -m http.server 8002 --bind 127.0.0.1 --directory "$RUNNER_TEMP/idp" > "$RUNNER_TEMP/idp-server.log" 2>&1 &
          # The last try decides: a server that never answers fails here, with its log.
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8002/.well-known/openid-configuration && break; sleep 1; done
          curl -fsS http://127.0.0.1:8002/.well-known/openid-configuration >/dev/null || { cat "$RUNNER_TEMP/idp-server.log"; exit 1; }
      - name: Start the instance for the passkey sign-in (development settings)
        env:
          OIDC_SERVER_URL: http://127.0.0.1:8002
          OIDC_CLIENT_ID: housecairn
          OIDC_PROVIDER_NAME: Company SSO
          # WebAuthn needs a secure origin: http://localhost is one for the browser, and the
          # server accepts it when DEBUG is on (MFA_WEBAUTHN_ALLOW_INSECURE_ORIGIN).
          DEBUG: "true"
          HOUSECAIRN_DATA_DIR: ${{ runner.temp }}/passkey-data
        run: |
          mkdir -p "$HOUSECAIRN_DATA_DIR"
          uv run python manage.py migrate --noinput
          uv run python manage.py shell -c "
          from housecairn.accounts.models import User
          from housecairn.homes import services
          user = User.objects.create_user(email='demo@example.com', password='correct-horse-battery-staple')
          services.create_home(user, name='Main house')
          # The passkey check registers a passkey on the account above, which then asks for it
          # at every sign-in: the form checks sign in as an account of their own.
          forms = User.objects.create_user(email='forms@example.com', password='correct-horse-battery-staple')
          forms_home = services.create_home(forms, name='Main house')
          # The rooms and items that the multiple-choice check picks from (docs/adr/0063).
          from housecairn.rooms import services as rooms
          kitchen = rooms.create_room(forms, forms_home, name='Kitchen')
          cellar = rooms.create_room(forms, forms_home, name='Cellar')
          rooms.create_room(forms, forms_home, name='Attic')
          rooms.create_item(forms, kitchen, name='Oven')
          rooms.create_item(forms, kitchen, name='Hob')
          rooms.create_item(forms, cellar, name='Boiler')
          admin = User.objects.create_superuser(email='admin@example.com', password='correct-horse-battery-staple')
          services.create_home(admin, name='Main house')
          "
          nohup uv run python manage.py runserver 127.0.0.1:8001 --noreload > "$RUNNER_TEMP/passkey-server.log" 2>&1 &
          # The last try decides: a server that never answers fails here, with its log.
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8001/healthz >/dev/null || { cat "$RUNNER_TEMP/passkey-server.log"; exit 1; }
      - name: Sign in with a passkey (virtual authenticator)
        run: |
          uv run python tests/e2e/browser_checks.py passkey --base http://localhost:8001
      - name: One click from the sign-in page to the identity provider
        run: |
          uv run python tests/e2e/browser_checks.py sso \
            --base http://localhost:8001 --provider http://127.0.0.1:8002
      - name: A refused form puts its summary of errors on screen, with and without HTMX or script
        run: |
          uv run python tests/e2e/browser_checks.py form-errors --base http://localhost:8001
      - name: Several rooms or items chosen by search and chips, by keyboard, at 375 px and without script
        run: |
          uv run python tests/e2e/chip_select_checks.py --base http://localhost:8001
      - name: The tabs of the instance administration do not run into each other
        run: |
          uv run python tests/e2e/browser_checks.py instance-tabs --base http://localhost:8001
      - name: The public accounts of a demonstration instance stack and are never cut, at 320, 375 and 1280 px
        env:
          HOUSECAIRN_DEMO: "true"
          DEBUG: "true"
          HOUSECAIRN_DATA_DIR: ${{ runner.temp }}/demo-data
        run: |
          mkdir -p "$HOUSECAIRN_DATA_DIR"
          uv run python manage.py migrate --noinput
          nohup uv run python manage.py runserver 127.0.0.1:8005 --noreload > "$RUNNER_TEMP/demo-server.log" 2>&1 &
          # The last try decides: a server that never answers fails here, with its log.
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8005/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8005/healthz >/dev/null || { cat "$RUNNER_TEMP/demo-server.log"; exit 1; }
          uv run python tests/e2e/browser_checks.py demo-accounts --base http://localhost:8005
      - name: The offer to receive the reminders on this device, with a simulated browser push (docs/adr/0072)
        env:
          HOUSECAIRN_NOTIFICATIONS_ENABLED: "true"
          HOUSECAIRN_WEBPUSH_ENABLED: "true"
          DEBUG: "true"
          HOUSECAIRN_DATA_DIR: ${{ runner.temp }}/offer-data
        run: |
          mkdir -p "$HOUSECAIRN_DATA_DIR"
          uv run python manage.py migrate --noinput
          uv run python manage.py shell -c "
          from housecairn.accounts.models import User
          from housecairn.homes import services
          user = User.objects.create_user(email='offer@example.com', password='correct-horse-battery-staple')
          services.create_home(user, name='Main house')
          "
          nohup uv run python manage.py runserver 127.0.0.1:8006 --noreload > "$RUNNER_TEMP/offer-server.log" 2>&1 &
          # The last try decides: a server that never answers fails here, with its log.
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8006/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8006/healthz >/dev/null || { cat "$RUNNER_TEMP/offer-server.log"; exit 1; }
          uv run python tests/e2e/device_offer_checks.py --base http://localhost:8006

  offline:
    # The installable application and offline reading (docs/adr/0065): the manifest, the
    # service worker's scope at the root and under a path prefix, Today and the task list
    # read from the cache with writes off, and the cache emptied at sign-out and for another
    # person. Production settings and gunicorn, as in the image: the service worker and
    # WhiteNoise are what is checked, not the development server.
    name: Installable app and offline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies with the docs group (uv sync --locked)
        run: uv sync --locked --group docs
      - name: Compile the translations
        uses: $/.github/actions/compile-messages
      - name: Install the browser (playwright install)
        run: uv run playwright install --with-deps --only-shell --no-progress chromium
      - name: Two accounts, each with a home, and a task due today
        run: |
          export HOUSECAIRN_DATA_DIR="$RUNNER_TEMP/offline-data"
          echo "HOUSECAIRN_DATA_DIR=$HOUSECAIRN_DATA_DIR" >> "$GITHUB_ENV"
          mkdir -p "$HOUSECAIRN_DATA_DIR"
          uv run python manage.py migrate --noinput
          uv run python manage.py collectstatic --noinput -v0
          uv run python manage.py shell -c "
          from housecairn.accounts.models import User
          from housecairn.homes import services
          from housecairn.tasks import services as tasks
          user = User.objects.create_user(email='demo@example.com', password='correct-horse-battery-staple')
          home = services.create_home(user, name='Main house')
          tasks.create_task(user, home, title='Replace the smoke alarm battery', due_on=tasks.today())
          other = User.objects.create_user(email='second@example.com', password='correct-horse-battery-staple')
          services.create_home(other, name='Flat')
          "
      - name: Start the instance at the root and under /housecairn (gunicorn)
        working-directory: src
        run: |
          nohup ../.venv/bin/gunicorn housecairn.wsgi -b 127.0.0.1:8003 > "$RUNNER_TEMP/root.log" 2>&1 &
          HOUSECAIRN_URL_PREFIX=/housecairn nohup ../.venv/bin/gunicorn housecairn.wsgi -b 127.0.0.1:8004 > "$RUNNER_TEMP/prefix.log" 2>&1 &
          # The last try decides: a server that never answers fails here, with its log.
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8003/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8003/healthz >/dev/null || { cat "$RUNNER_TEMP/root.log"; exit 1; }
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8004/housecairn/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8004/housecairn/healthz >/dev/null || { cat "$RUNNER_TEMP/prefix.log"; exit 1; }
      - name: Offline reading at the root
        run: uv run python tests/e2e/pwa_checks.py --base http://localhost:8003
      - name: Offline reading under a path prefix
        run: uv run python tests/e2e/pwa_checks.py --base http://localhost:8004/housecairn
