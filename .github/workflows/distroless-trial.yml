# TEMPORARY: runs the measurements of ADR 0087 (docs/adr/0087-trial/measure.sh)
# once on the pull request of the study, then is removed from the branch before
# review. Not a status check; publishes nothing.
name: Distroless trial

on:
  push:
    branches: [hermes/2026-11-18-distroless-study]
    paths:
      - docs/adr/0087-trial/**
      - .github/workflows/distroless-trial.yml

permissions: {}

jobs:
  trial:
    name: Distroless trial measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read # check out the repository
    env:
      GRYPE_VERSION: "0.121.0"
      GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
      SYFT_VERSION: "1.56.0"
      SYFT_SHA256: 1c2493cfcf52d3367d6cb25780d9190c111c2219c34c820574c43e8bae15c528
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Grype and Syft (checksums verified)
        env:
          GITHUB_TOKEN: ${{ github.token }} # read-only; API rate limit only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          .github/scripts/release-asset.sh anchore/grype "v${GRYPE_VERSION}" \
            "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" "$RUNNER_TEMP/grype.tar.gz"
          echo "${GRYPE_SHA256}  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check --strict
          .github/scripts/release-asset.sh anchore/syft "v${SYFT_VERSION}" \
            "syft_${SYFT_VERSION}_linux_amd64.tar.gz" "$RUNNER_TEMP/syft.tar.gz"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/bin" grype
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/bin" syft
      - name: Measure
        run: GRYPE="$RUNNER_TEMP/bin/grype" SYFT="$RUNNER_TEMP/bin/syft" OUT="$RUNNER_TEMP/trial" docs/adr/0087-trial/measure.sh
      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distroless-trial
          path: ${{ runner.temp }}/trial
          retention-days: 30
