{% load i18n l10n live %}{# The year to show: it is chosen, and the page follows, no Show button (design/patterns.md, "Filters and search"). `year`, `years`, `kind`. The file of the page is `_csv.html`, inside what is swapped. #}
{% if kind != "projects" %}
<form method="get" class="filter-row" {% live_form %}>
  <label for="budget-year">{% translate "Year" %}</label>
  <select id="budget-year" name="year" {% live_change %}>
    {% for candidate in years %}<option value="{{ candidate|unlocalize }}"{% if candidate == year %} selected{% endif %}>{{ candidate|unlocalize }}</option>{% endfor %}
  </select>
  <button type="submit" class="button-secondary button-small filters-apply">{% translate "Show" %}</button>
</form>
{% endif %}
