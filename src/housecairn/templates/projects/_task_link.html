{% load i18n navigation %}{% if project %}<p class="small">{% translate "Part of the project" %} <a href="{% url_with_next 'projects:detail' home_id=home.id project_id=project.id %}">{{ project.title }}</a></p>
{% if can_write %}<form method="post" action="{% url 'projects:task-detach' home_id=home.id project_id=project.id task_id=task.id %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" class="button-secondary button-small">{% translate "Take out" %}<span class="visually-hidden"> {{ project.title }}</span></button></form>{% endif %}{% endif %}
