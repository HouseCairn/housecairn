[project]
name = "housecairn"
version = "0.3.2"
description = "Self-hosted planner for home maintenance and renovation projects."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.14"
authors = [{ name = "Robvred" }]
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3.13",
  "Private :: Do Not Upload",
]
dependencies = [
  "django>=5.2.8,<5.3",
  # Encrypts the secrets kept in the database (docs/adr/0035); already installed by
  # django-allauth's passkey support, now a direct dependency.
  "cryptography>=45",
  "djangorestframework>=3.16",
  "drf-spectacular>=0.28",
  "drf-spectacular-sidecar>=2025.1.1",
  # Extras of the same package: "mfa" brings fido2 (passkeys), "socialaccount"
  # brings the OpenID Connect client (see docs/adr/0001).
  "django-allauth[mfa,socialaccount]>=65.13",
  "django-q2>=1.8",
  "django-environ>=0.12",
  "django-csp>=4.0",
  "python-dateutil>=2.9",
  # Amounts as each language writes them, with the symbol of the currency (CLDR data;
  # docs/adr/0054). Already locked for the documentation group.
  "babel>=2.18",
  # Lets classes such as ModelAdmin[Home] be written at runtime for the type
  # checker; companion of django-stubs (see docs/adr/0001).
  "django-stubs-ext>=5.2,<5.3",
  # Production WSGI server and static files served by the application, used
  # by the container image (see docs/adr/0015).
  "gunicorn>=23",
  "whitenoise>=6.9",
  "pillow>=12",
  "markdown-it-py>=4",
  "apprise>=2.1",
  "icalendar>=7.3,<8",
  "reportlab>=5.1",
  # Reads the library of task templates (docs/adr/0049); already installed by
  # drf-spectacular and apprise, now a direct dependency.
  "pyyaml>=6",
]

[project.optional-dependencies]
# PostgreSQL driver, only for instances that set DATABASE_URL to PostgreSQL
# (see docs/adr/0001). SQLite needs nothing more.
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
  "ruff>=0.14",
  "mypy>=1.18",
  "django-stubs[compatible-mypy]>=5.2,<5.3",
  "djangorestframework-stubs>=3.16",
  "pytest>=8.4",
  "pytest-django>=4.11",
  "pytest-cov>=7.0",
  "types-python-dateutil>=2.9",
  "hypothesis>=6.170.14",
  "types-reportlab>=4",
  "pytest-xdist>=3.8",
]
# Documentation site and the browser checks (docs/adr/0016):
# uv sync --locked --group docs.
docs = [
  # Sphinx 9.2 needs Python 3.13, the project's Python (docs/adr/0016).
  "sphinx>=9.2",
  "furo>=2025.12.19",
  "myst-parser>=5.1",
  "sphinx-intl>=2.4",
  "playwright>=1.64",
  "sphinx-copybutton>=0.5.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/housecairn"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/housecairn/*/migrations/*"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "DJ", "C4", "SIM", "RUF", "PT", "N", "A", "T20",
]
ignore = [
  "RUF012",  # Django and DRF class attributes (Meta, fields) are mutable by design.
]

[tool.ruff.lint.isort]
# Repository scripts run by CI (docs/adr/0014), imported by the tests.
known-first-party = ["scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = [
  "allauth.*",
  "django_q.*",
  "environ.*",
  "gunicorn.*",
  "csp.*",
  "drf_spectacular.*",
  "drf_spectacular_sidecar.*",
  # Documentation group only (docs/adr/0016): not installed by `uv sync`.
  "playwright.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["housecairn.*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["housecairn"]
branch = true
omit = ["*/migrations/*", "src/housecairn/asgi.py", "src/housecairn/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
